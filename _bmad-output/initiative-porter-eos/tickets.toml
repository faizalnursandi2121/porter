# tickets.toml — PORTER v1 epics in build order. Epic id = task-list group number; entry refs read as <group>.<sub>, equal to the subtask id.

[[epic]]
id = 0
slug = "epic-e0-tooling"
title = "Tooling baseline: branch, env, shadcn, module nav"
covers = []
after = []

[[epic]]
id = 1
slug = "epic-e1-foundation"
title = "Schema, models, seeders, timezone helper, private disk"
covers = ["CAP-10"]
after = [{ epic = 0, needs = "branch and local env ready" }]

[[epic]]
id = 2
slug = "epic-e2-auth-rbac"
title = "Auth, RBAC, account management"
covers = ["CAP-1"]
after = [{ epic = 1, needs = "roles/users schema" }]

[[epic]]
id = 3
slug = "epic-e3-master-placement"
title = "Site master data and EOS placement"
covers = ["CAP-8", "CAP-1"]
after = [{ epic = 1, needs = "sites/assignments schema" }, { epic = 2, needs = "RBAC policies" }]

[[epic]]
id = 4
slug = "epic-e4-attendance"
title = "Attendance with selfie+GPS, watermark, gates, PWA"
covers = ["CAP-2", "CAP-3", "CAP-9", "CAP-10"]
after = [{ epic = 1, needs = "attendance schema + private disk" }, { epic = 2, needs = "RBAC" }, { epic = 3, needs = "site master data" }]

[[epic]]
id = 5
slug = "epic-e5-daily-report"
title = "Daily Report: template, form, drafts, numbering, revision, reopen"
covers = ["CAP-4", "CAP-7"]
after = [{ epic = 1, needs = "report schema" }, { epic = 2, needs = "RBAC" }, { epic = 3, needs = "site/EOS names for report binding and filters" }]

[[epic]]
id = 6
slug = "epic-e6-inventory"
title = "Inventory per site and consumable stock"
covers = ["CAP-5", "CAP-7"]
after = [{ epic = 1, needs = "inventory schema + private disk" }, { epic = 2, needs = "RBAC" }, { epic = 3, needs = "site identity + placement moves for ownership" }]

[[epic]]
id = 7
slug = "epic-e7-dashboard-audit"
title = "KPI dashboard, export, audit log, photo access, ops docs"
covers = ["CAP-6", "CAP-7"]
after = [{ epic = 1, needs = "audit schema" }, { epic = 2, needs = "RBAC" }, { epic = 3, needs = "site data" }, { epic = 4, needs = "attendance data" }, { epic = 5, needs = "report data" }, { epic = 6, needs = "inventory data" }]
